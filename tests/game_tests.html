<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Свинолов — Набор автоматических тестов</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; background: #0f172a; color: #f8fafc; padding: 24px; line-height: 1.5; }
        h1 { color: #38bdf8; font-size: 22px; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; }
        .subtitle { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }
        .summary { font-size: 16px; margin-bottom: 24px; padding: 14px 18px; border-radius: 10px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .summary.passed { background: #064e3b; color: #34d399; border: 1px solid #059669; }
        .summary.failed { background: #7f1d1d; color: #f87171; border: 1px solid #dc2626; }
        .suite { margin-bottom: 18px; border: 1px solid #334155; border-radius: 10px; padding: 14px; background: #1e293b; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2); }
        .suite-title { color: #facc15; font-weight: bold; margin-bottom: 10px; font-size: 15px; border-bottom: 1px solid #334155; padding-bottom: 6px; }
        .test-case { padding: 6px 10px; margin: 4px 0; border-radius: 6px; font-size: 13px; display: flex; justify-content: space-between; align-items: center; }
        .test-case.pass { background: rgba(52, 211, 153, 0.12); color: #4ade80; }
        .test-case.fail { background: rgba(248, 113, 113, 0.18); color: #f87171; font-weight: bold; }
        .log { margin-top: 4px; font-size: 12px; color: #fca5a5; font-family: monospace; background: rgba(0,0,0,0.3); padding: 4px 8px; border-radius: 4px; }
        .badge { padding: 2px 8px; border-radius: 4px; font-weight: bold; font-size: 11px; }
        .badge.pass { background: #059669; color: #ecfdf5; }
        .badge.fail { background: #dc2626; color: #fef2f2; }
    </style>
</head>
<body>
    <h1>🐷 Тестовый люкс игрового движка «Свинолов»</h1>
    <div class="subtitle">Автоматизированная проверка механик, физики, ИИ свинок, амбаров, магазина и сетевой синхронизации</div>
    <div id="test-summary" class="summary">Выполнение тестов...</div>
    <div id="test-output"></div>
    <canvas id="game-canvas" width="960" height="600" style="display:none;"></canvas>

    <!-- Подключение игровых скриптов -->
    <script src="../js/config.js"></script>
    <script src="../js/storage.js"></script>
    <script src="../js/audio.js"></script>
    <script src="../js/fx.js"></script>
    <script src="../js/world.js"></script>
    <script src="../js/pig.js"></script>
    <script src="../js/player.js"></script>
    <script src="../js/helper.js"></script>
    <script src="../js/peerjs.min.js"></script>
    <script src="../js/network.js"></script>
    <script src="../js/shop.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/game.js"></script>

    <script>
    (function() {
        const results = [];
        let currentSuite = '';

        function suite(name, fn) {
            currentSuite = name;
            try { fn(); }
            catch (e) {
                test('Фатальная ошибка сьюта', () => { throw e; });
            }
        }

        function test(name, fn) {
            try {
                fn();
                results.push({ suite: currentSuite, name, pass: true });
            } catch (err) {
                results.push({ suite: currentSuite, name, pass: false, error: err.message || String(err) });
            }
        }

        function assert(cond, msg) {
            if (!cond) throw new Error(msg || 'Assertion failed');
        }

        function assertEqual(actual, expected, msg) {
            if (actual !== expected) {
                throw new Error(`${msg || 'Equality failed'}: actual (${actual}) !== expected (${expected})`);
            }
        }

        function assertClose(actual, expected, delta = 0.05, msg) {
            if (Math.abs(actual - expected) > delta) {
                throw new Error(`${msg || 'Close failed'}: actual (${actual}) not close to expected (${expected}) within ${delta}`);
            }
        }

        // Общий макет игрового мира для тестов механик
        const mockWorld = {
            w: 1500,
            h: 1050,
            margin: 36,
            resolve: () => {},
            inMud: () => false,
            isFree: () => true,
            isOnBridge: () => false,
            door: { x: 750, y: 150 }
        };

        // =========================================================================
        // СЬЮТ 1: Конфигурация и Баланс (CONFIG)
        // =========================================================================
        suite('1. Конфигурация игры (CONFIG)', () => {
            test('Базовые параметры скорости и радиуса корректны', () => {
                assert(CONFIG.PLAYER_SPEED > 200, 'Скорость игрока должна быть > 200');
                assert(CONFIG.CATCH_RADIUS >= 60, 'Радиус сачка должен быть >= 60');
                assert(CONFIG.SWING_COOLDOWN > 0.2 && CONFIG.SWING_COOLDOWN < 1.0, 'Кулдаун сачка в разумных пределах');
                assert(CONFIG.DASH_COOLDOWN >= 1.5, 'Кулдаун рывка >= 1.5с');
                assert(CONFIG.SWING_MISS_FACTOR < 1.0, 'Промах перезаряжается быстрее удара');
            });

            test('Параметры 1v1 Battle Mode сбалансированы', () => {
                assertEqual(CONFIG.BATTLE_DURATION, 60, 'Длительность битвы ровно 60 сек');
                assertEqual(CONFIG.BATTLE_PIG_TARGET, 8, 'Плотность поросят в битве = 8');
                assertEqual(CONFIG.BATTLE_WIN_REWARD, 25, 'Награда за победу = 25');
                assertEqual(CONFIG.BATTLE_DRAW_REWARD, 10, 'Награда за ничью = 10');
            });

            test('Цепочки достижений сконфигурированы', () => {
                assert(Array.isArray(ACHIEVEMENT_CHAINS), 'ACHIEVEMENT_CHAINS массив');
                assert(ACHIEVEMENT_CHAINS.length >= 8, 'Не менее 8 цепочек достижений');
                for (const ach of ACHIEVEMENT_CHAINS) {
                    assert(ach.id && ach.name, 'Достижение имеет id и name');
                    assert(Array.isArray(ach.tiers) && ach.tiers.length > 0, 'Цепочка имеет степени');
                }
            });
        });

        // =========================================================================
        // СЬЮТ 2: Механики Персонажа (Player)
        // =========================================================================
        suite('2. Игрок и Физика (Player)', () => {
            test('Создание игрока и свойства по умолчанию', () => {
                const p = new Player(400, 300, 1);
                assertEqual(p.x, 400);
                assertEqual(p.y, 300);
                assertEqual(p.id, 1);
                assertEqual(p.stun, 0);
                assertEqual(p.cd, 0);
                assert(p.canSwing(), 'Игрок может делать взмах сачком на старте');
            });

            test('Взмах сачком и кулдаун', () => {
                const p = new Player(100, 100, 1);
                p.swing(true); // промах
                assert(p.cd > 0, 'Кулдаун сачка активен');
                assert(!p.canSwing(), 'Нельзя повторно взмахнуть сачком во время кулдауна');
                assertClose(p.cd, p.swingCd * CONFIG.SWING_MISS_FACTOR, 0.05);

                // Обновление таймера кулдауна
                p.update(p.cd + 0.05, { world: mockWorld }, 0, 0);
                assert(p.canSwing(), 'После истечения кулдауна взмах снова доступен');
            });

            test('Продолжительный спринт и шкала выносливости', () => {
                const p = new Player(100, 100, 1);
                assertEqual(p.sprintT, 3.0, 'Начальный запас сил = 3.0с');
                assert(!p.isExhausted, 'Не истощен на старте');

                // Симуляция зажатия спринта на 1 секунду
                p.isSprintPressed = () => true;
                p.update(1.0, { world: mockWorld }, 1, 0);
                assert(p.isSprinting, 'Персонаж в режиме спринта');
                assertClose(p.sprintT, 2.0, 0.15, 'Осталось ~2.0с выносливости');

                // Отпускаем спринт: выносливость восстанавливается
                p.isSprintPressed = () => false;
                p.update(0.5, { world: mockWorld }, 0, 0);
                assert(!p.isSprinting, 'Спринт выключен');
                assert(p.sprintT > 2.0, 'Выносливость восстанавливается');
            });

            test('Полное истощение выносливости (штраф 1.2с и восстановление с 25%)', () => {
                const p = new Player(100, 100, 1);
                p.isSprintPressed = () => true;
                // Тратим все 3 секунды
                p.update(3.2, { world: mockWorld }, 1, 0);
                assertEqual(p.sprintT, 0, 'Выносливость на нуле');
                assert(p.isExhausted, 'Флаг истощения isExhausted активирован');
                assert(!p.isSprinting, 'Спринт выключен из-за усталости');

                // Во время штрафной задержки восстанавливаться не должно
                p.isSprintPressed = () => false;
                p.update(0.5, { world: mockWorld }, 0, 0);
                assertEqual(p.sprintT, 0, 'Во время штрафной задержки выносливость 0');

                // После штрафной задержки (1.2с) начинается регенерация, и при достижении 25% истощение снимается
                p.update(2.5, { world: mockWorld }, 0, 0);
                assert(!p.isExhausted, 'Истощение снято после достаточного отдыха (>=25%)');
                assert(p.sprintT > 0, 'Выносливость восполнилась');
            });

            test('Сетевая изоляция: applyNetworkState не трогает локального игрока', () => {
                const p = new Player(100, 100, 1);
                p.isLocal = true;
                p.isRemote = false;
                p.cd = 0;
                p.targetX = 100;
                p.targetY = 100;

                // Попытка применить сетевой снимок от напарника к локальному игроку
                p.applyNetworkState({ x: 999, y: 999, swingT: 0.18, stun: 1.0 });
                assertEqual(p.x, 100, 'Координата локального игрока защищена от перезаписи');
                assertEqual(p.cd, 0, 'Кулдаун локального игрока не сброшен чужим пакетом');
                assertEqual(p.stun, 0, 'Локальный игрок не застанен чужим пакетом');

                // А для удаленного игрока (isRemote = true) состояние применяется штатно
                const remoteP = new Player(100, 100, 2);
                remoteP.isLocal = false;
                remoteP.isRemote = true;
                remoteP.applyNetworkState({ x: 500, y: 400, stun: 0.5 });
                assertEqual(remoteP.targetX, 500, 'targetX обновлен для удаленного игрока');
                assertEqual(remoteP.stun, 0.5, 'Стан применен для удаленного игрока');
            });
        });

        // =========================================================================
        // СЬЮТ 3: Поведение Поросят (Pig)
        // =========================================================================
        suite('3. ИИ и Поведение Поросят (Pig)', () => {
            test('Создание свинки и базовые состояния', () => {
                const pig = new Pig('pink', 200, 200, 1);
                assertEqual(pig.type, 'pink');
                assertEqual(pig.state, 'wander');
                assert(pig.hp >= 1, 'HP свинки >= 1');
                assert(pig.active, 'Свинья активна');
                assert(!pig.inBarn, 'Свинья на поле, не в амбаре');
            });

            test('Усталость свинки после панического рывка (burst)', () => {
                const pig = new Pig('runner', 200, 200, 1);
                // Запуск спринтерского рывка
                pig.startBurst(0, 0.8, mockWorld);
                assertEqual(pig.state, 'burst');
                assert(pig.stateT > 0, 'Время рывка активно');

                // Завершение рывка и включение фазы истощения
                pig.sprintBurstT = 0;
                pig.fatigueT = 3.0; // Фаза усталости
                assert(pig.fatigueT > 0, 'Таймер усталости активен');
            });

            test('Поросята с несколькими жизнями (кабан/босс) и отбрасывание', () => {
                const big = new Pig('big', 300, 300, 10);
                assert(big.hp > 1, 'Кабан имеет несколько жизней');
                assertEqual(big.state, 'wander');

                // Нанесение удара сачком
                big.hp -= 1;
                big.knock(250, 300, 300);
                assert(big.kx !== 0 || big.ky !== 0, 'Отбрасывание от сачка (kx, ky)');
            });
        });

        // =========================================================================
        // СЬЮТ 4: Игровой Мир и Амбары (World)
        // =========================================================================
        suite('4. Игровой мир и Двойные амбары (World)', () => {
            test('Создание мира и наличие центрального амбара', () => {
                const w = new World(0, 0, 'solo');
                assert(w.door, 'У амбара есть координаты ворот door');
                assert(w.w >= 800, 'Ширина поля >= 800');
                assert(w.h >= 500, 'Высота поля >= 500');
            });

            test('Двойные амбары на 6-м уровне престижа', () => {
                const w = new World(0, 0, 'solo', 0, 6, true);
                assert(w.hasDualBarns, 'Режим двойных амбаров активирован');
                assert(w.doors.length === 2, 'В мире ровно 2 двери амбаров');
                assert(w.northDoor && w.southDoor, 'Присутствуют северные и южные ворота');
                assert(w.northDoor.y < w.southDoor.y, 'Северный амбар выше южного по координате Y');
            });

            test('Интерактивное пугало отпугивает свиней при активации', () => {
                const w = new World(0, 0, 'coop');
                const scarecrow = w.interactives.find(it => it.type === 'scarecrow');
                assert(scarecrow, 'Пугало присутствует на карте мира');

                const pig = new Pig('pink', scarecrow.x + 30, scarecrow.y, 1);
                const fakeGame = { pigs: [pig], fx: { dust: () => {} }, sfx: { combo: () => {} } };

                w.triggerInteractive(scarecrow.x, scarecrow.y, 40, fakeGame);
                assert(scarecrow.wobble > 0, 'Пугало качается после взаимодействия');
                assert(pig.scared > 0, 'Ближайшая свинья испугалась пугала');
            });
        });

        // =========================================================================
        // СЬЮТ 5: Магазин и Прогресс (Shop & Storage)
        // =========================================================================
        suite('5. Магазин и Улучшения (Shop & Storage)', () => {
            test('Блокировка улучшений помощников до найма помощника', () => {
                const s = new StorageManager();
                s.data = { coins: 500, day: 20, prestige: 0, upgrades: { helper1: 0, helper_speed: 0 } };

                // Проверка правила: helper_speed требует helper1 >= 1
                const speedDef = UPGRADES.helper_speed;
                const canBuyBefore = (s.data.upgrades.helper1 || 0) > 0;
                assert(!canBuyBefore, 'Улучшение скорости напарников заблокировано, пока не куплен напарник');

                // Нанимаем помощника
                s.data.upgrades.helper1 = 1;
                const canBuyAfter = (s.data.upgrades.helper1 || 0) > 0;
                assert(canBuyAfter, 'После найма напарника улучшение helper_speed разблокировано');
            });

            test('Блокировка лая до найма собаки Бобика', () => {
                const s = new StorageManager();
                s.data = { coins: 500, day: 20, prestige: 0, upgrades: { dog: 0, dog_bark: 0 } };

                const dogUnlockedBefore = (s.data.upgrades.dog || 0) > 0;
                assert(!dogUnlockedBefore, 'Лай заблокирован до покупки собаки');

                s.data.upgrades.dog = 1;
                const dogUnlockedAfter = (s.data.upgrades.dog || 0) > 0;
                assert(dogUnlockedAfter, 'Лай разблокирован после найма собаки');
            });
        });

        // =========================================================================
        // СЬЮТ 6: Сетевой модуль и Онлайн-битва (Network & Battle)
        // =========================================================================
        suite('6. Сетевой модуль и Режимы онлайна (Network)', () => {
            test('Нормализация кода комнаты cleanCode', () => {
                assertEqual(NetworkManager.cleanCode('58391'), '58391');
                assertEqual(NetworkManager.cleanCode('PIG-58391'), '58391');
                assertEqual(NetworkManager.cleanCode('pig-12345'), '12345');
                assertEqual(NetworkManager.cleanCode('SVIN-99999'), '99999');
                assertEqual(NetworkManager.cleanCode('  svin 77712  '), '77712');
            });

            test('Конфигурация ICE содержит STUN и TURN OpenRelay для VPN', () => {
                assert(Array.isArray(ICE_SERVERS), 'ICE_SERVERS определен');
                const hasStun = ICE_SERVERS.some(s => Array.isArray(s.urls) ? s.urls.some(u => u.startsWith('stun:')) : s.urls.startsWith('stun:'));
                const hasTurn = ICE_SERVERS.some(s => Array.isArray(s.urls) ? s.urls.some(u => u.startsWith('turn:')) : s.urls.startsWith('turn:'));
                assert(hasStun, 'Присутствуют STUN серверы Google/Cloudflare');
                assert(hasTurn, 'Присутствуют защищенные TURN серверы OpenRelay для обхода VPN');
                assertEqual(PEER_CONFIG.config.iceCandidatePoolSize, 10, 'Пул кандидатов pre-pooled = 10 для мгновенного коннекта');
            });

            test('Сетевые роли: applyOnlinePlayerRoles разграничивает Host и Guest', () => {
                const fakeGame = {
                    player: new Player(400, 300, 1),
                    player2: new Player(500, 300, 2),
                    isOnline: true,
                    netRole: 'host',
                    applyOnlinePlayerRoles: Game.prototype.applyOnlinePlayerRoles
                };

                // Для Хоста: P1 локальный, P2 удаленный
                fakeGame.netRole = 'host';
                fakeGame.applyOnlinePlayerRoles();
                assert(fakeGame.player.isLocal && !fakeGame.player.isRemote, 'Хост управляет P1 локально');
                assert(!fakeGame.player2.isLocal && fakeGame.player2.isRemote, 'P2 для Хоста является удаленным');

                // Для Гостя: P1 удаленный, P2 локальный
                fakeGame.netRole = 'guest';
                fakeGame.applyOnlinePlayerRoles();
                assert(!fakeGame.player.isLocal && fakeGame.player.isRemote, 'P1 для Гостя является удаленным Хостом');
                assert(fakeGame.player2.isLocal && !fakeGame.player2.isRemote, 'Гость управляет P2 локально');
            });

            test('Исключение залипания управления при сетевом эхе PLAYER_SWING', () => {
                const fakeGame = {
                    player: new Player(400, 300, 1),
                    player2: new Player(500, 300, 2),
                    isOnline: true,
                    netRole: 'guest',
                    sfx: { swing: () => {} },
                    receiveNetEvent: Game.prototype.receiveNetEvent,
                    applyOnlinePlayerRoles: Game.prototype.applyOnlinePlayerRoles
                };
                fakeGame.applyOnlinePlayerRoles();

                // Игрок 2 (Гость) локальный
                const p2 = fakeGame.player2;
                p2.cd = 0;
                assert(p2.canSwing(), 'Гость готов взмахнуть сачком');

                // При получении сетевого события PLAYER_SWING для своего же p=2 эхо отсекается
                const preCd = p2.cd;
                fakeGame.receiveNetEvent('PLAYER_SWING', { p: 2, miss: false });
                assertEqual(p2.cd, preCd, 'Входящее сетевое эхо не сбивает локальный кулдаун игрока');
            });
        });

        // =========================================================================
        // РЕНДЕР РЕЗУЛЬТАТОВ ТЕСТОВ
        // =========================================================================
        const total = results.length;
        const passed = results.filter(r => r.pass).length;
        const failed = total - passed;

        const summaryEl = document.getElementById('test-summary');
        summaryEl.textContent = `Результаты: ${passed} из ${total} тестов пройдено успешно (${failed} ошибок)`;
        summaryEl.className = 'summary ' + (failed === 0 ? 'passed' : 'failed');

        const outputEl = document.getElementById('test-output');
        const suitesMap = new Map();

        for (const r of results) {
            if (!suitesMap.has(r.suite)) suitesMap.set(r.suite, []);
            suitesMap.get(r.suite).push(r);
        }

        for (const [suiteName, tests] of suitesMap) {
            const suiteDiv = document.createElement('div');
            suiteDiv.className = 'suite';
            const title = document.createElement('div');
            title.className = 'suite-title';
            title.textContent = suiteName;
            suiteDiv.appendChild(title);

            for (const t of tests) {
                const item = document.createElement('div');
                item.className = 'test-case ' + (t.pass ? 'pass' : 'fail');
                item.innerHTML = `<span>${t.pass ? '✔' : '✖'} ${t.name}</span><span class="badge ${t.pass ? 'pass' : 'fail'}">${t.pass ? 'PASS' : 'FAIL'}</span>`;
                if (!t.pass && t.error) {
                    const err = document.createElement('div');
                    err.className = 'log';
                    err.textContent = `Ошибка: ${t.error}`;
                    item.appendChild(err);
                }
                suiteDiv.appendChild(item);
            }
            outputEl.appendChild(suiteDiv);
        }

        console.log(`[TEST_RUNNER_SUMMARY] TOTAL=${total} PASSED=${passed} FAILED=${failed}`);
        window.__TEST_RESULTS__ = { total, passed, failed, results };
    })();
    </script>
</body>
</html>
